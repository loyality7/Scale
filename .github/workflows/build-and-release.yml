name: Build & Release Scale

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution (Release)
        run: dotnet build -c Release --no-restore

      - name: Publish Standalone Portable Executable
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Package Release Zip
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./ScaleWindows-win-x64.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ScaleWindows-Portable-win-x64
          path: ./ScaleWindows-win-x64.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./ScaleWindows-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
